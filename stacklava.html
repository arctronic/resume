<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STACKLAVA · a Tetris × Platformer remix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌋</text></svg>">
<style>
html,body{margin:0;height:100%;background:#070510;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;display:block}
.tb{position:fixed;z-index:5;width:60px;height:60px;border-radius:14px;font:700 24px/1 "Courier New",monospace;color:#fff;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.07)}
.tb.c{border:2px solid rgba(80,230,120,.55)}
.tb.p{border:2px solid rgba(95,150,255,.55)}
.tb:active{background:rgba(255,255,255,.25)}
body.touch .tb{display:flex}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<noscript style="color:#fff;font-family:monospace">STACKLAVA needs JavaScript to erupt.</noscript>
<script>
"use strict";
/* ============================================================
   STACKLAVA — a retro remix: Tetris × Platformer
   You drop the pieces AND you are the tiny climber.
   Build the tower, climb it, reach the EXIT door
   before the lava reaches you. Single file, no deps.
   ============================================================ */

// ---------- constants ----------
const COLS=12, ROWS=22, B=26;            // well size, block px
const WALL=B, TOP=36, PANEL=200;
const PFX=WALL, PFY=TOP;                 // playfield origin
const PFW=COLS*B, PFH=ROWS*B;
const FLOORY=PFY+PFH;                    // top of floor
const CW=WALL+PFW+WALL+PANEL;            // 564
const CH=TOP+PFH+B+10;                   // 644
const DR=3;                              // door top row (2 rows tall)
const CLW=16, CLH=22;                    // climber size
const RUN=148, GRV=1180, JV=370, JCUT=120;
const R=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ---------- canvas ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const S=Math.min(2,Math.max(1,Math.round(window.devicePixelRatio||1)));
cv.width=CW*S; cv.height=CH*S;
function resize(){
  const k=Math.min(window.innerWidth/CW, window.innerHeight/CH);
  cv.style.width=(CW*k)+'px'; cv.style.height=(CH*k)+'px';
}
window.addEventListener('resize',resize); resize();

// ---------- colors ----------
const COL={I:'#3be8ff',J:'#5b8cff',L:'#ff9d3c',O:'#ffd83d',S:'#4dec6a',T:'#c46bff',Z:'#ff5468',G:'#8f8a96'};
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function shade(h,f){
  const c=hex2rgb(h).map(v=>clamp(Math.round(f<1?v*f:v+(255-v)*(f-1)),0,255));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
const LIT={},DRK={};
for(const k in COL){LIT[k]=shade(COL[k],1.45);DRK[k]=shade(COL[k],0.42)}

// ---------- tetrominoes ----------
const BASE={
  I:{n:4,c:[[0,1],[1,1],[2,1],[3,1]]},
  J:{n:3,c:[[0,0],[0,1],[1,1],[2,1]]},
  L:{n:3,c:[[2,0],[0,1],[1,1],[2,1]]},
  O:{n:2,c:[[0,0],[1,0],[0,1],[1,1]]},
  S:{n:3,c:[[1,0],[2,0],[0,1],[1,1]]},
  T:{n:3,c:[[1,0],[0,1],[1,1],[2,1]]},
  Z:{n:3,c:[[0,0],[1,0],[1,1],[2,1]]}
};
const ROT={};
for(const t in BASE){
  const n=BASE[t].n, rs=[BASE[t].c];
  for(let i=1;i<4;i++) rs.push(rs[i-1].map(p=>[n-1-p[1],p[0]]));
  ROT[t]=rs;
}
const KICKS=[[0,0],[-1,0],[1,0],[0,-1],[-1,-1],[1,-1],[-2,0],[2,0]];

// ---------- audio ----------
let ac=null,mg=null,noiseBuf=null,rumGain=null,muted=false,musNext=0,musStep=0;
const BASSN=[45,52,45,52,45,52,45,52, 45,52,45,52,45,52,45,57, 41,48,41,48,41,48,41,48, 43,50,43,50,43,50,47,50];
const LEADN=[69,0,72,74,76,0,74,72, 69,0,72,74,76,79,76,74, 77,0,76,74,72,0,69,72, 74,0,71,67,74,76,79,0];
const nf=n=>440*Math.pow(2,(n-69)/12);
function unlock(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return }
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain(); mg.gain.value=muted?0:0.9; mg.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=R()*2-1;
    const src=ac.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=85;
    rumGain=ac.createGain(); rumGain.gain.value=0;
    src.connect(f); f.connect(rumGain); rumGain.connect(mg); src.start();
    musNext=ac.currentTime+0.1; musStep=0;
  }catch(e){ac=null}
}
function beep(type,f0,f1,d,v,when){
  if(!ac) return;
  const t=when!==undefined?when:ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(Math.max(20,f0),t);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  o.connect(g); g.connect(mg); o.start(t); o.stop(t+d+0.03);
}
function nz(d,v,fr,when){
  if(!ac) return;
  const t=when!==undefined?when:ac.currentTime;
  const s=ac.createBufferSource(); s.buffer=noiseBuf;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fr;
  const g=ac.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  s.connect(f); f.connect(g); g.connect(mg); s.start(t); s.stop(t+d+0.03);
}
const sMove =()=>beep('square',220,0,0.025,0.045);
const sRot  =()=>beep('square',330,495,0.05,0.06);
const sHold =()=>beep('square',360,300,0.05,0.06);
const sJump =()=>beep('square',240,540,0.12,0.06);
const sLand =()=>nz(0.04,0.07,800);
const sLock =()=>{nz(0.07,0.16,500);beep('triangle',150,85,0.09,0.18)};
const sHard =()=>{nz(0.1,0.26,700);beep('triangle',190,70,0.12,0.26)};
const sWarn =()=>{beep('square',150,110,0.18,0.12);beep('square',150,110,0.18,0.12,ac?ac.currentTime+0.25:0)};
const sBurp =()=>{nz(0.5,0.3,150);beep('sine',60,130,0.45,0.3)};
const sDie  =()=>{beep('sawtooth',280,55,0.8,0.22);nz(0.5,0.25,420)};
const sDunk =()=>{beep('square',990,0,0.05,0.1);beep('square',1320,0,0.16,0.1,ac?ac.currentTime+0.055:0)};
function sClear(n){ if(!ac)return; for(let i=0;i<n+2;i++) beep('square',420*Math.pow(1.3,i),0,0.07,0.09,ac.currentTime+i*0.045) }
function sWin(){ if(!ac)return; [440,554,659,880,1109].forEach((f,i)=>beep('square',f,0,0.18,0.1,ac.currentTime+i*0.09)); nz(0.5,0.08,6000,ac.currentTime+0.45) }
function music(){
  if(!ac) return;
  const ok=!muted && !paused && (ST==='play'||ST==='title'||ST==='won');
  while(musNext<ac.currentTime+0.15){
    if(!ok){ musNext=ac.currentTime+0.15; break }
    const bpm=Math.min(168,124+(lvl-1)*7), sd=30/bpm;
    const i=musStep%32;
    if(BASSN[i]) beep('triangle',nf(BASSN[i]),0,sd*0.9,0.10,musNext);
    if(LEADN[i]) beep('square',nf(LEADN[i]),0,sd*0.95,ST==='title'?0.03:0.045,musNext);
    if(lvl>=2&&ST==='play'&&i%4===2) nz(0.03,0.04,6000,musNext);
    musStep++; musNext+=sd;
  }
}

// ---------- state ----------
let T=0, ST='title', paused=false, reason='';
let score=0, lines=0, lvl=1, combo=0, hs=0, winBonus=0, winY=0;
try{hs=+localStorage.getItem('slv_hs')||0}catch(e){}
let grid=[], P=null, bag=[], nextQ=[], holdT=null, canHold=true;
let acc=0, lockT=0, resets=0, spawnT=0, clearing=null, clearT=0;
let lavaY=1e9, doorSide=1, burpT=1e9, burpWarn=false;
let dasT=0, dasDir=0;
const held={pl:0,pr:0,soft:0,cl:0,cr:0,jump:0};
const cl={x:0,y:0,vx:0,vy:0,face:1,grounded:false,coyote:0,jbuf:0,run:0,sq:0};
let parts=[], txts=[], embers=[], bubbles=[];
let shM=0, shT=0, shD=1, flA=0;

const LSPDf=()=> (B/7)*(1+0.22*(lvl-1));
const GRAVf=()=> Math.min(6,1.15+0.32*(lvl-1));
const burpIv=()=> lvl>=2 ? Math.max(11,22-1.5*lvl) : 1e9;
const lavaY0=()=> FLOORY+B*1.7;

function mkGrid(){ const g=[]; for(let r=0;r<ROWS;r++) g.push(new Array(COLS).fill(0)); return g }
function nextT(){ if(!bag.length){ bag=['I','J','L','O','S','T','Z']; for(let i=bag.length-1;i>0;i--){const j=(R()*(i+1))|0; const t=bag[i];bag[i]=bag[j];bag[j]=t} } return bag.pop() }

function resetLevel(){
  grid=mkGrid(); P=null; bag=[]; nextQ=[nextT(),nextT(),nextT()];
  holdT=null; canHold=true; acc=0; lockT=0; resets=0; spawnT=0.6;
  clearing=null; combo=0; lavaY=lavaY0(); doorSide=(lvl%2)?1:-1;
  burpT=burpIv(); burpWarn=false; dasT=0;
  cl.x=PFX+PFW/2-CLW/2; cl.y=FLOORY-CLH; cl.vx=0; cl.vy=0;
  cl.face=doorSide; cl.grounded=true; cl.coyote=0; cl.jbuf=0; cl.run=0; cl.sq=0;
  parts=[]; txts=[]; bubbles=[]; shT=0; flA=0;
  for(const k in held) held[k]=0;
  addTxt(PFX+PFW/2,PFY+PFH/2,'LEVEL '+lvl+' — EXIT '+(doorSide<0?'TOP LEFT':'TOP RIGHT'),'#ffd24a',true);
}
function startGame(){ score=0; lines=0; lvl=1; resetLevel(); ST='play'; paused=false }

// ---------- collision ----------
function solidPiece(px,py,pr,t){
  for(const cell of ROT[t][pr]){
    const c=px+cell[0], r=py+cell[1];
    if(c<0||c>=COLS||r>=ROWS) return true;
    if(r>=0&&grid[r][c]) return true;
  }
  return false;
}
function coll(x,y){
  if(x<PFX||x+CLW>PFX+PFW) return true;
  if(y+CLH>FLOORY) return true;
  if(y<PFY-B*1.5) return true;
  const c0=Math.floor((x-PFX)/B), c1=Math.floor((x+CLW-0.01-PFX)/B);
  const r0=Math.floor((y-PFY)/B), r1=Math.floor((y+CLH-0.01-PFY)/B);
  for(let r=Math.max(r0,0);r<=Math.min(r1,ROWS-1);r++)
    for(let c=Math.max(c0,0);c<=Math.min(c1,COLS-1);c++)
      if(grid[r][c]) return true;
  return false;
}

// ---------- piece logic ----------
function spawn(){
  P={t:nextQ.shift(),r:0,x:4,y:0}; nextQ.push(nextT());
  acc=0; lockT=0; resets=0;
  if(solidPiece(P.x,P.y,P.r,P.t)){ P=null; gameOver('TOPPED OUT') }
}
function tryMove(dx,dy){
  if(!P) return false;
  if(solidPiece(P.x+dx,P.y+dy,P.r,P.t)) return false;
  const wasG=solidPiece(P.x,P.y+1,P.r,P.t);
  P.x+=dx; P.y+=dy;
  if(wasG&&resets<14){lockT=0;resets++}
  return true;
}
function tryRot(d){
  if(!P) return false;
  const nr=(P.r+d+4)%4;
  for(const k of KICKS){
    if(!solidPiece(P.x+k[0],P.y+k[1],nr,P.t)){
      const wasG=solidPiece(P.x,P.y+1,P.r,P.t);
      P.x+=k[0]; P.y+=k[1]; P.r=nr;
      if(wasG&&resets<14){lockT=0;resets++}
      sRot(); return true;
    }
  }
  return false;
}
function hardDrop(){
  if(!P) return;
  let d=0;
  while(!solidPiece(P.x,P.y+1,P.r,P.t)){P.y++;d++}
  score+=d*2; sHard(); shake(5,0.18); lock();
}
function doHold(){
  if(!P||!canHold) return;
  canHold=false; sHold();
  const c=P.t;
  if(holdT){
    P={t:holdT,r:0,x:4,y:0}; holdT=c; acc=0; lockT=0; resets=0;
    if(solidPiece(P.x,P.y,P.r,P.t)){ P=null; gameOver('TOPPED OUT') }
  }else{
    holdT=c; P=null; spawnT=0.05;
  }
}
function lock(){
  if(!P) return;
  sLock(); shake(Math.max(shM,2.5),0.1);
  let over=false;
  for(const cell of ROT[P.t][P.r]){
    const c=P.x+cell[0], r=P.y+cell[1];
    if(r<0){over=true}
    else{
      grid[r][c]=P.t;
      dust(PFX+c*B+B/2,PFY+r*B+2,2);
    }
  }
  P=null; canHold=true;
  if(over){ gameOver('TOPPED OUT'); return }
  if(!unstick('SQUISHED')) return;
  const full=[];
  for(let r=0;r<ROWS;r++) if(grid[r].every(v=>v)) full.push(r);
  if(full.length){ clearing=full; clearT=0.33 }
  else { combo=0; spawnT=0.18 }
}
function finishClear(){
  const n=clearing.length;
  const sr=Math.floor((cl.y+CLH+2-PFY)/B);
  const dunk=cl.grounded&&clearing.indexOf(sr)>=0;
  for(const r of clearing)
    for(let c=0;c<COLS;c++)
      spark(PFX+c*B+B/2,PFY+r*B+B/2,COL[grid[r][c]]||'#fff',3,110);
  const set=new Set(clearing);
  grid=grid.filter((_,i)=>!set.has(i));
  while(grid.length<ROWS) grid.unshift(new Array(COLS).fill(0));
  combo++;
  let pts=[0,100,300,500,800][n]*lvl;
  if(combo>1) pts+=(combo-1)*50*lvl;
  if(dunk) pts+=200*n*lvl;
  score+=pts; lines+=n;
  lavaY=Math.min(lavaY+n*B*0.55,lavaY0());
  addTxt(PFX+PFW/2,PFY+clearing[0]*B,'+'+pts,'#ffd24a',n===4);
  if(n===4){flA=0.45; addTxt(PFX+PFW/2,PFY+clearing[0]*B-22,'TETRIS!','#3be8ff',true)}
  if(dunk){addTxt(cl.x+CLW/2,cl.y-14,'DUNK!','#4dec6a',true); sDunk()}
  if(lavaY<CH) addTxt(PFX+PFW-46,lavaY-12,'COOLED ▼','#ff9d3c',false);
  sClear(n);
  unstick('SQUISHED');
  clearing=null; spawnT=0.16;
}

// ---------- climber ----------
function unstick(why){
  if(!coll(cl.x,cl.y)) return true;
  const offs=[[0,-B*0.5],[0,-B],[0,-B*1.5],[0,-B*2],[-B*0.7,0],[B*0.7,0],[-B,-B],[B,-B],[0,-B*2.6]];
  for(const o of offs){
    if(!coll(cl.x+o[0],cl.y+o[1])){
      cl.x+=o[0]; cl.y+=o[1]; cl.vy=Math.min(cl.vy,0);
      dust(cl.x+CLW/2,cl.y+CLH,4);
      return true;
    }
  }
  gameOver(why); return false;
}
function updClimber(dt){
  const dir=(held.cl?-1:0)+(held.cr?1:0);
  cl.vx=dir*RUN;
  if(dir) cl.face=dir;
  cl.jbuf-=dt; cl.coyote-=dt;
  if(cl.grounded) cl.coyote=0.09;
  if(cl.jbuf>0&&(cl.grounded||cl.coyote>0)){
    cl.vy=-JV; cl.grounded=false; cl.coyote=0; cl.jbuf=0;
    sJump(); dust(cl.x+CLW/2,cl.y+CLH,3);
  }
  if(!held.jump&&cl.vy<-JCUT) cl.vy=-JCUT;
  // horizontal, small substeps + auto step-up (mantle)
  let rem=cl.vx*dt;
  while(Math.abs(rem)>0.01){
    const d=Math.abs(rem)>3?Math.sign(rem)*3:rem; rem-=d;
    if(!coll(cl.x+d,cl.y)){ cl.x+=d; continue }
    let st=false;
    if(cl.vy>=0){
      for(const s of [B*0.45,B*0.8,B*1.08]){
        if(!coll(cl.x+d,cl.y-s)){ cl.x+=d; cl.y-=s; st=true; break }
      }
    }
    if(!st) rem=0;
  }
  // vertical
  cl.vy=Math.min(cl.vy+GRV*dt,560);
  const pv=cl.vy;
  let remy=cl.vy*dt;
  while(Math.abs(remy)>0.01){
    const d=Math.abs(remy)>4?Math.sign(remy)*4:remy; remy-=d;
    if(!coll(cl.x,cl.y+d)){ cl.y+=d; continue }
    if(d>0){ while(!coll(cl.x,cl.y+1)) cl.y+=1 }
    else { while(!coll(cl.x,cl.y-1)) cl.y-=1 }
    cl.vy=0; remy=0;
  }
  const wasG=cl.grounded;
  cl.grounded=coll(cl.x,cl.y+1.5);
  if(cl.grounded&&!wasG&&pv>240){ sLand(); cl.sq=0.3; dust(cl.x+CLW/2,cl.y+CLH,4) }
  if(cl.grounded&&dir) cl.run+=Math.abs(cl.vx)*dt*0.07;
  cl.sq=Math.max(0,cl.sq-dt*2.2);
}

// ---------- lava events ----------
function doBurp(){
  grid.shift();
  const row=new Array(COLS).fill('G');
  const holes=new Set();
  while(holes.size<3) holes.add((R()*COLS)|0);
  holes.forEach(h=>row[h]=0);
  grid.push(row);
  if(cl.grounded) cl.y-=B;
  unstick('SQUISHED');
  if(P){ let n=0; while(solidPiece(P.x,P.y,P.r,P.t)&&n++<6) P.y-- }
  shake(6,0.25); sBurp();
  addTxt(PFX+PFW/2,Math.min(lavaY,FLOORY)-40,'LAVA BURP!','#ff8a1e',false);
  for(let i=0;i<10;i++) spark(PFX+R()*PFW,Math.min(lavaY,FLOORY),'#ff8a1e',1,140);
}
function win(){
  const gap=(lavaY-(cl.y+CLH))/B;
  winBonus=1000*lvl+Math.max(0,Math.floor(gap*40));
  score+=winBonus; winY=cl.y; ST='won';
  if(score>hs){hs=score; try{localStorage.setItem('slv_hs',hs)}catch(e){}}
  sWin();
  for(let i=0;i<60;i++){
    const ks=Object.keys(COL);
    parts.push({x:cl.x+CLW/2,y:cl.y,vx:(R()*2-1)*220,vy:-R()*330-60,g:520,life:0.9+R()*0.8,t:0,col:COL[ks[(R()*ks.length)|0]],sz:2+R()*3});
  }
}
function gameOver(why){
  if(ST!=='play') return;
  ST='over'; reason=why; paused=false;
  sDie(); shake(8,0.5);
  if(score>hs){hs=score; try{localStorage.setItem('slv_hs',hs)}catch(e){}}
  if(why!=='TOPPED OUT') spark(cl.x+CLW/2,cl.y+CLH/2,why==='MELTED'?'#ff8a1e':'#ff5468',16,180);
}

// ---------- fx helpers ----------
function spark(x,y,col,n,sp){
  for(let i=0;i<n;i++)
    parts.push({x,y,vx:(R()*2-1)*sp,vy:(R()*2-1)*sp-40,g:300,life:0.4+R()*0.4,t:0,col,sz:2+R()*2});
}
function dust(x,y,n){
  for(let i=0;i<n;i++)
    parts.push({x:x+(R()*2-1)*8,y,vx:(R()*2-1)*40,vy:-R()*50-10,g:160,life:0.3+R()*0.3,t:0,col:'#9b94a8',sz:1.5+R()*1.5});
}
function addTxt(x,y,txt,col,big){ txts.push({x,y,txt,col,big,t:0,life:big?1.5:1.1}) }
function shake(m,d){ shM=m; shT=d; shD=d }
function updFx(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>p.life){parts.splice(i,1);continue}
    p.x+=p.vx*dt; p.vy+=p.g*dt; p.y+=p.vy*dt;
  }
  for(let i=txts.length-1;i>=0;i--){
    const t=txts[i]; t.t+=dt; t.y-=20*dt;
    if(t.t>t.life) txts.splice(i,1);
  }
  for(const e of embers){
    e.y-=e.v*dt; e.x+=Math.sin(T+e.ph)*9*dt;
    if(e.y<-4){e.y=CH+4; e.x=R()*CW}
  }
  if(lavaY<CH-2&&R()<dt*8)
    bubbles.push({x:PFX+4+R()*(PFW-8),y:lavaY+8+R()*26,vy:-(14+R()*22),r:1.5+R()*2.5});
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i]; b.y+=b.vy*dt;
    if(b.y<lavaY-3){ if(R()<0.4) spark(b.x,lavaY-2,'#ffd24a',1,40); bubbles.splice(i,1) }
  }
  if(shT>0) shT-=dt;
  if(flA>0) flA=Math.max(0,flA-dt*1.4);
}
for(let i=0;i<40;i++) embers.push({x:R()*CW,y:R()*CH,v:6+R()*14,a:0.05+R()*0.12,s:1+R()*1.6,ph:R()*6});

// ---------- update ----------
function update(dt){
  updFx(dt);
  if(ST==='title') return;
  if(ST==='won'){
    cl.y=winY-Math.abs(Math.sin(T*5.2))*16;
    cl.face=Math.sin(T*2.6)>0?1:-1; cl.run+=dt*8;
    return;
  }
  if(ST==='over') return;
  // --- play ---
  lavaY-=LSPDf()*dt;
  if(burpT<1e8){
    burpT-=dt;
    if(burpT<1.1&&!burpWarn){burpWarn=true; sWarn()}
    if(burpT<=0){doBurp(); burpT=burpIv(); burpWarn=false}
  }
  if(clearing){
    clearT-=dt;
    if(clearT<=0) finishClear();
  } else if(!P){
    spawnT-=dt;
    if(spawnT<=0) spawn();
  }
  if(P){
    if(held.pl||held.pr){
      dasT+=dt;
      while(dasT>0.14){ dasT-=0.045; tryMove(dasDir,0) }
    } else dasT=0;
    acc+=GRAVf()*(held.soft?13:1)*dt;
    while(acc>=1){
      acc-=1;
      if(!solidPiece(P.x,P.y+1,P.r,P.t)){ P.y++; if(held.soft)score+=1 }
      else { acc=0; break }
    }
    if(P&&solidPiece(P.x,P.y+1,P.r,P.t)){
      lockT+=dt;
      if(lockT>=0.42) lock();
    } else lockT=0;
  }
  updClimber(dt);
  if(ST!=='play') return;
  if(cl.y+CLH>lavaY+3){ gameOver('MELTED'); return }
  const zy0=PFY+DR*B, zy1=PFY+(DR+2)*B;
  if(cl.y+CLH>zy0+4&&cl.y<zy1-2){
    if(doorSide<0 ? cl.x<=PFX+4 : cl.x+CLW>=PFX+PFW-4){ win(); return }
  }
  if(rumGain){
    const gap=(lavaY-(cl.y+CLH))/B;
    rumGain.gain.value=clamp(1-gap/6,0,1)*0.13;
  }
}

// ---------- main loop ----------
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  T+=dt;
  music();
  if(!paused) update(dt);
  draw();
}

  unlock();

  if(ST==='over'){ if(a==='go'||a==='retry') startGame(); return }
  if(a==='pause'){ paused=!paused; return }
  if(paused){ if(a==='retry'){ paused=false; ST='title'; resetLevel() } return }
  switch(a){
    case 'pl': held.pl=1; dasDir=-1; dasT=0; if(tryMove(-1,0)) sMove(); break;
    case 'pr': held.pr=1; dasDir=1; dasT=0; if(tryMove(1,0)) sMove(); break;
    case 'soft': held.soft=1; break;
    case 'rot': tryRot(1); break;
    case 'rcc': tryRot(-1); break;
    case 'go': hardDrop(); break;
    case 'hold': doHold(); break;
    case 'cl': held.cl=1; break;
    case 'cr': held.cr=1; break;
    case 'jump': held.jump=1; cl.jbuf=0.12; break;
  }
}
function release(a){
  switch(a){
    case 'pl': held.pl=0; if(held.pr){dasDir=1;dasT=0} break;
    case 'pr': held.pr=0; if(held.pl){dasDir=-1;dasT=0} break;
    case 'soft': held.soft=0; break;
    case 'cl': held.cl=0; break;
    case 'cr': held.cr=0; break;
    case 'jump': held.jump=0; break;
  }
}
window.addEventListener('keydown',e=>{
  const a=KM[e.code];
  if(!a) return;
  e.preventDefault();
  if(!e.repeat) press(a);
});
window.addEventListener('keyup',e=>{ const a=KM[e.code]; if(a) release(a) });
window.addEventListener('blur',()=>{ for(const k in held) held[k]=0; if(ST==='play') paused=true });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&ST==='play') paused=true });
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); unlock(); if(ST!=='play') press('go') });

// touch buttons
window.addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});
const BTNS=[
  ['◀','cl','c','left:14px;bottom:14px'],
  ['▶','cr','c','left:86px;bottom:14px'],
  ['⬆','jump','c','left:50px;bottom:86px'],
  ['◀','pl','p','right:158px;bottom:14px'],
  ['▼','soft','p','right:86px;bottom:14px'],
  ['▶','pr','p','right:14px;bottom:14px'],
  ['⟳','rot','p','right:86px;bottom:86px'],
  ['⤓','go','p','right:14px;bottom:86px'],
  ['❚❚','pause','p','right:14px;top:14px;width:44px;height:44px;font-size:14px']
];
for(const b of BTNS){
  const el=document.createElement('div');
  el.className='tb '+b[2]; el.textContent=b[0]; el.style.cssText+=b[3];
  el.addEventListener('pointerdown',e=>{e.preventDefault();press(b[1])});
  el.addEventListener('pointerup',e=>{e.preventDefault();release(b[1])});
  el.addEventListener('pointercancel',()=>release(b[1]));
  el.addEventListener('pointerleave',()=>release(b[1]));
  document.body.appendChild(el);
}

// ---------- go ----------
resetLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
